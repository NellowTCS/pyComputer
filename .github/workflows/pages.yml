name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build demo
        working-directory: Demo
        run: npm ci && npm run build

      - name: Build docs
        working-directory: Docs
        run: npm ci && npm run build

      - name: Prepare pages root
        run: |
          mkdir -p pages-root/docs
          cp -r Demo/dist/* pages-root/
          cp -r Docs/site/* pages-root/docs/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-root
          publish_branch: gh-pages
          cname: nellowtcs.me
          commit_message: "deploy: demo + docs"
