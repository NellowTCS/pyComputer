<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pyComputer Web Demo</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{color:#00ff41;background:#0a0a0a;flex-direction:column;height:100vh;font-family:Fira Code,Consolas,monospace;display:flex}#header{background:linear-gradient(90deg,#0d1117 0%,#161b22 50%,#0d1117 100%);border-bottom:1px solid #2d333b;justify-content:space-between;align-items:center;padding:12px 20px;display:flex}#header h1{letter-spacing:1px;align-items:center;gap:10px;font-size:18px;font-weight:600;display:flex}#header h1:before{content:"⬢";color:#00ff41}#status{color:#8b949e;font-size:12px}#status.loading{color:#f0883e}#status.ready{color:#3fb950}#theme-buttons{gap:8px;display:flex}#theme-buttons button{color:#8b949e;cursor:pointer;background:0 0;border:1px solid #30363d;border-radius:4px;padding:4px 10px;font-family:inherit;font-size:12px}#theme-buttons button:hover{color:#e6edf3;border-color:#8b949e}#theme-buttons button.active{color:#58a6ff;background:#21262d;border-color:#58a6ff}#terminal-container{background:var(--term-bg,#0a0a0a);flex:1;padding:10px}#terminal{height:100%}.xterm{padding:8px}.xterm-viewport{background-color:#0000!important}</style>
  <script type="module" crossorigin src="./assets/index-BN1vhKCs.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BrP-ENHg.css">
</head>
<body>
  <div id="header">
    <h1>pyComputer</h1>
    <div style="display: flex; align-items: center; gap: 20px;">
      <div id="theme-buttons">
        <button id="btn-auto" data-theme="auto" onclick="setTheme('auto')">Auto</button>
        <button id="btn-light" data-theme="light" onclick="setTheme('light')">Light</button>
        <button id="btn-dark" data-theme="dark" onclick="setTheme('dark')">Dark</button>
      </div>
      <div id="status" class="loading">Loading Pyodide...</div>
    </div>
  </div>
  <div id="terminal-container">
    <div id="terminal"></div>
  </div>

  <script>
    const themes = {
      light: { bg: "#ffffff", fg: "#000000", cursor: "#000000", selection: "rgba(0, 0, 0, 0.2)", header: "#f0f0f0", border: "#d0d0d0", btn: "#e0e0e0", btnActive: "#d0d0d0", accent: "#0066cc", muted: "#666666" },
      dark: { bg: "#0a0a0a", fg: "#ffffff", cursor: "#ffffff", selection: "rgba(255, 255, 255, 0.3)", header: "#0d1117", border: "#2d333b", btn: "#30363d", btnActive: "#21262d", accent: "#58a6ff", muted: "#8b949e" }
    };
    function getSystemTheme() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function applyTheme(name) {
      const t = themes[name] || themes.light;
      document.body.style.background = t.bg;
      document.body.style.color = t.fg;
      document.getElementById('header').style.background = `linear-gradient(90deg, ${t.header} 0%, ${t.header} 50%, ${t.header} 100%)`;
      document.getElementById('header').style.borderColor = t.border;
      if (window.term) {
        window.term.options.theme = { background: t.bg, foreground: t.fg, cursor: t.cursor, selection: t.selection };
      }
      if (window.setWebTheme) window.setWebTheme(name);
    }
    function highlightBtn(theme) {
      document.querySelectorAll('#theme-buttons button').forEach(b => b.classList.remove('active'));
      if (theme === 'auto') {
        document.getElementById('btn-auto').classList.add('active');
      } else if (theme === 'light') {
        document.getElementById('btn-light').classList.add('active');
      } else if (theme === 'dark') {
        document.getElementById('btn-dark').classList.add('active');
      }
    }
    function setTheme(theme) {
      if (theme === 'auto') {
        applyTheme(getSystemTheme());
        highlightBtn('auto');
      } else {
        applyTheme(theme);
        highlightBtn(theme);
      }
    }
    window.setTheme = setTheme;
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      applyTheme(getSystemTheme());
    });
    setTheme('auto');
  </script>
</body>
</html>
