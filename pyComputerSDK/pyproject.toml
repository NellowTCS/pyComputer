[project]
name = "pycomputersdk"
version = "0.1.0"
description = "SDK for developing pyComputer apps"
authors = [
    { name = "NellowTCS", email = "neeljaiswal23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tuiro>=0.1.1",
    "pycomputer",
]

[tool.uv.sources]
pycomputer = { path = "../pyComputer" }

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
